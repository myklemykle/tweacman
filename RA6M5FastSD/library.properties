author=Mykle <myklemykle@gmail.com>
maintainer=Mykle <myklemykle@gmail.com>
sentence=A drop-in replacement for the Renesas core's SDCardBlockDevice that reads and writes many sectors per SD command.
paragraph=The core's SD driver issues one command per 512-byte sector, which caps reads at about 2MB/s on any card. Writes are the same. This subclass asks the SD host for the whole request in one multi-block command instead. It also fixes the core's driver garbling data for buffers that aren't 4-byte aligned. Experimental: it reaches into the core class's private members rather than replacing the driver outright.
