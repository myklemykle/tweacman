sentence=Capacitive touch sensing using the RA6M5's built-in CTSU peripheral, on any RA6M5 board.
paragraph=Reads a graduated, proximity-capable value (not just touched/not-touched) from the RA6M5's real hardware touch-sensing unit. Clean-room implementation against the RA6M5 Hardware User's Manual, polled from loop() rather than interrupt-driven, in the style of this project's other libraries.
