sentence=A drop-in replacement for the Renesas core's SDCardBlockDevice that reads and writes many sectors per SD command, skips needless erases, and caches the directory reads FatFs repeats.
paragraph=The core's SD driver issues one command per 512-byte sector, which caps reads at about 2MB/s on any card. Writes are the same, and FatFs erases before every write, one command per sector. This subclass asks the SD host for the whole request in one multi-block command instead, and skips the erases, which SD cards don't need. And it caches single-sector reads, read 8 sectors at a time - FatFs, as the core builds it, re-reads every directory on the way to a file each time one is opened. It also fixes the core's driver garbling data for buffers that aren't 4-byte aligned. Experimental: it reaches into the core class's private members rather than replacing the driver outright.
