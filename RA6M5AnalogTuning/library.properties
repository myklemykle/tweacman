name=RA6M5AnalogTuning
version=1.0.0
author=Mykle <myklemykle@gmail.com>
maintainer=Mykle <myklemykle@gmail.com>
sentence=Tunes the RA6M5's ADC for high-impedance sources like potentiometers, removing crosstalk between analog pins.
paragraph=Sets two ADC options the Arduino core leaves at their defaults - a longer sampling time, and discharging the sample-and-hold capacitor before every conversion - which together cut crosstalk between pots on neighbouring analog pins from hundreds of counts to about one. One call from setup(); compiles to nothing on any other chip, so sketches can call it unconditionally.
